name: plataforma

services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    shm_size: 256m
    # Valores para un VPS de 4 GB compartido con otros servicios.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=1GB
      # Valor general; cada proyecto puede definir el suyo con ALTER ROLE.
      - -c
      - statement_timeout=5min
      - -c
      - idle_in_transaction_session_timeout=5min
      - -c
      - log_min_duration_statement=500ms
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      # Desde PostgreSQL 18, los datos se montan aquí y no en .../data.
      - postgres_datos:/var/lib/postgresql
    ports:
      # Solo accesible desde el propio VPS. Desde la Mac se llega con un túnel SSH.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_datos:
