services:
  postgres:
    image: postgres:18
    container_name: xdr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xdr}
      POSTGRES_USER: ${POSTGRES_USER:-xdr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      # Desde PostgreSQL 18, los datos se montan aquí y no en .../data.
      - postgres_datos:/var/lib/postgresql
    ports:
      # Solo accesible desde el propio VPS. Desde la Mac se llega con un túnel SSH.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_datos:
